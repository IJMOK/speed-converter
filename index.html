<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Converter</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --input-bg: #ffffff;
            --input-border: #d0d0d0;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-primary: #1a1a1a;
                --bg-secondary: #2d2d2d;
                --text-primary: #ffffff;
                --text-secondary: #aaaaaa;
                --border-color: #404040;
                --accent-color: #3b82f6;
                --accent-hover: #2563eb;
                --input-bg: #2d2d2d;
                --input-border: #404040;
            }
        }

        :root[data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --border-color: #404040;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --input-bg: #2d2d2d;
            --input-border: #404040;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--bg-secondary);
            border-radius: 12px;
            padding: 40px 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            .container:not([data-theme="light"]) {
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            }
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 14px;
        }

        .converter-section {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 16px;
            align-items: flex-end;
        }

        @media (max-width: 480px) {
            .converter-section {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .divider {
                display: none;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            padding: 12px 16px;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            font-size: 16px;
            background-color: var(--input-bg);
            color: var(--text-primary);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--text-secondary);
            height: 44px;
            font-weight: 300;
        }

        .divider::before {
            content: "⇄";
        }

        .info-box {
            background-color: rgba(37, 99, 235, 0.1);
            border-left: 4px solid var(--accent-color);
            padding: 16px;
            border-radius: 6px;
            margin-top: 32px;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .conversion-info {
            margin-top: 8px;
            padding: 12px;
            background-color: var(--bg-primary);
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
        }

        .conversion-info.active {
            color: var(--accent-color);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Speed Converter</h1>
        <p class="subtitle">Convert between kilometers and miles per hour</p>

        <div class="converter-section">
            <div class="input-group">
                <label for="kmh-input">Kilometers per Hour</label>
                <input
                    type="number"
                    id="kmh-input"
                    placeholder="Enter km/h"
                    step="0.1"
                >
            </div>

            <div class="divider"></div>

            <div class="input-group">
                <label for="mph-input">Miles per Hour</label>
                <input
                    type="number"
                    id="mph-input"
                    placeholder="Enter mph"
                    step="0.1"
                >
            </div>
        </div>

        <div class="conversion-info" id="conversion-info">
            Enter a value to see the conversion
        </div>

        <div class="info-box">
            <strong>Conversion Factors:</strong><br>
            1 km/h = 0.621371 mph<br>
            1 mph = 1.60934 km/h
        </div>
    </div>

    <script>
        const kmhInput = document.getElementById('kmh-input');
        const mphInput = document.getElementById('mph-input');
        const conversionInfo = document.getElementById('conversion-info');

        const KM_TO_MILES = 0.621371;
        const MILES_TO_KM = 1.60934;
        const DECIMAL_PLACES = 2;

        function formatNumber(num) {
            if (num === '' || num === null || num === undefined) return '';
            const parsed = parseFloat(num);
            if (isNaN(parsed)) return '';
            return parsed.toFixed(DECIMAL_PLACES);
        }

        function updateFromKmh() {
            const kmhValue = kmhInput.value.trim();

            if (kmhValue === '') {
                mphInput.value = '';
                conversionInfo.textContent = 'Enter a value to see the conversion';
                conversionInfo.classList.remove('active');
                return;
            }

            const kmh = parseFloat(kmhValue);

            if (isNaN(kmh)) {
                mphInput.value = '';
                conversionInfo.textContent = 'Please enter a valid number';
                conversionInfo.classList.remove('active');
                return;
            }

            const mph = kmh * KM_TO_MILES;
            mphInput.value = formatNumber(mph);
            conversionInfo.textContent = `${formatNumber(kmh)} km/h = ${formatNumber(mph)} mph`;
            conversionInfo.classList.add('active');
        }

        function updateFromMph() {
            const mphValue = mphInput.value.trim();

            if (mphValue === '') {
                kmhInput.value = '';
                conversionInfo.textContent = 'Enter a value to see the conversion';
                conversionInfo.classList.remove('active');
                return;
            }

            const mph = parseFloat(mphValue);

            if (isNaN(mph)) {
                kmhInput.value = '';
                conversionInfo.textContent = 'Please enter a valid number';
                conversionInfo.classList.remove('active');
                return;
            }

            const kmh = mph * MILES_TO_KM;
            kmhInput.value = formatNumber(kmh);
            conversionInfo.textContent = `${formatNumber(mph)} mph = ${formatNumber(kmh)} km/h`;
            conversionInfo.classList.add('active');
        }

        kmhInput.addEventListener('input', updateFromKmh);
        mphInput.addEventListener('input', updateFromMph);

        // Set initial focus to km/h input
        kmhInput.focus();
    </script>
</body>
</html>
